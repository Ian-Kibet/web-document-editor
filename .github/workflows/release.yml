name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      - name: Run C# tests
        run: dotnet test tests/DocumentEditor.Engine.Tests/DocumentEditor.Engine.Tests.csproj -c Release

      - name: Build WASM engine
        run: dotnet publish src/DocumentEditor.Wasm/DocumentEditor.Wasm.csproj -c Release

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build vanilla library
        run: yarn workspace document-editor-vanilla build:lib

      - name: Build React library
        run: yarn workspace document-editor-react build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: yarn release
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
